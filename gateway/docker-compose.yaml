# Run on the host that already runs Whisper, Piper and Open WebUI.
#
# One-time setup:
#   1. git submodule update --init            (LVGL sources for the web UI build)
#   2. cp .env.example .env  and fill it in   (see that file)
#   3. Tailscale admin console: enable MagicDNS + HTTPS certificates, and
#      create a reusable auth key for TS_AUTHKEY
#   4. docker compose up -d --build
# Then open https://switchboard.<your-tailnet>.ts.net on the tablet.
#
# The Gateway shares the Tailscale sidecar's network namespace, so the
# tailnet HTTPS endpoint proxies straight to it on 127.0.0.1:8090, while
# the sidecar's attachment to the shared Docker network is what lets the
# Gateway reach OWUI / Whisper / Piper by container name.
services:
  switchboard-ts:
    image: tailscale/tailscale:latest
    hostname: switchboard
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: switchboard
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    networks: [shared]
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    network_mode: service:switchboard-ts
    depends_on: [switchboard-ts]
    env_file: .env
    environment:
      # Docker-network addresses override whatever dev values .env carries.
      SWITCHBOARD_OWUI_BASE_URL: ${OWUI_URL:?set OWUI_URL in .env (e.g. http://open-webui:8080)}
      # Wyoming is a raw TCP protocol, not HTTP.
      SWITCHBOARD_WHISPER_URI: ${WHISPER_URI:?set WHISPER_URI in .env (e.g. tcp://wyoming-whisper:10300)}
      SWITCHBOARD_PIPER_URI: ${PIPER_URI:?set PIPER_URI in .env (e.g. tcp://wyoming-piper:10200)}
      # "chatterbox" prefers the service below (falling back to Piper while it
      # warms up or if it is down); needs `--profile chatterbox` to be running.
      SWITCHBOARD_TTS_BACKEND: ${TTS_BACKEND:-piper}
      SWITCHBOARD_CHATTERBOX_URL: http://chatterbox:8000
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  # Optional higher-quality TTS: `docker compose --profile chatterbox up -d --build`
  # and set TTS_BACKEND=chatterbox in .env. First start downloads the model and
  # pre-tunes ~20 GPU shape buckets (a few minutes; cached in the volumes
  # below, so restarts are quick). Until it reports ready, the Gateway keeps
  # speaking with Piper.
  chatterbox:
    profiles: ["chatterbox"]
    build:
      context: ../services/chatterbox
      args:
        # ROCm 7.2 wheels by default; for NVIDIA use .../whl/cu126 and swap the
        # device/group lines below for `gpus: all`.
        TORCH_INDEX: ${CHATTERBOX_TORCH_INDEX:-https://download.pytorch.org/whl/rocm7.2}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    # Numeric host GIDs (names resolve inside the container, which lacks "render"):
    #   getent group video render
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    security_opt:
      - seccomp=unconfined
    ipc: host
    environment:
      CHATTERBOX_MODEL: turbo
      CHATTERBOX_DEVICE: cuda # ROCm builds of torch also call it "cuda"
    volumes:
      - chatterbox-hf:/root/.cache/huggingface
      - chatterbox-miopen-config:/root/.config/miopen
      - chatterbox-miopen-cache:/root/.cache/miopen
      # Reference clips (<name>.wav, ~10 s) referenced from config/voices.yaml
      - ../services/chatterbox/voices:/voices:ro
    networks: [shared]
    restart: unless-stopped

networks:
  shared:
    external: true
    name: ${DOCKER_NETWORK:?set DOCKER_NETWORK in .env to the network OWUI/Whisper/Piper are on}

volumes:
  ts-state:
  chatterbox-hf:
  chatterbox-miopen-config:
  chatterbox-miopen-cache:
